name: DevOps CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint Scripts and Dockerfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './scripts'

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_SHA="${GITHUB_SHA}" \
            -t devops-intern-app:${GITHUB_SHA} \
            -f app/Dockerfile .

  test:
    name: Test Docker Container
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image for testing
        run: |
          docker build \
            --build-arg BUILD_SHA="${GITHUB_SHA}" \
            -t devops-intern-test:${GITHUB_SHA} \
            -f app/Dockerfile .

      - name: Start test container
        run: |
          docker run -d \
            --name devops-nginx \
            -p 8080:8080 \
            devops-intern-test:${GITHUB_SHA}

      - name: Wait for application to become ready
        run: |
          for attempt in {1..10}; do
            if curl --silent --fail http://localhost:8080/healthz; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $attempt"
            sleep 3
          done
          echo "Application did not become ready."
          docker logs devops-nginx
          exit 1

      - name: Run application health check
        run: |
          bash scripts/healthcheck.sh http://localhost:8080/healthz

      - name: Verify build ID in webpage
        run: |
          curl --fail --silent http://localhost:8080/ | grep "${GITHUB_SHA}"

      - name: Clean up test container
        if: always()
        run: docker rm -f devops-nginx || true

  publish:
    name: Publish Image to GHCR
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for GHCR
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/nginx-app"
          docker build \
            --build-arg BUILD_SHA="${GITHUB_SHA}" \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            -f app/Dockerfile .

      - name: Push image to GHCR
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/nginx-app"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
